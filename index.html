button.sec{background:transparent;color:var(--pri)}

.q{font-size:1.5rem;font-weight:700;margin:6px 0 4px;line-height:1.4}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{text-align:left;font:inherit;background:var(--card);color:var(--tx);border:2px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--pri)}

.fb.ok{background:var(--okb)}.fb.no{background:var(--nob)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}

.opt.sel{border-color:var(--pri);background:color-mix(in srgb,var(--pri) 14%,var(--card))}

.opt.bad{border-color:var(--no);background:var(--nob)}
.big{font-size:3.2rem;font-weight:800;text-align:center;margin:0}
.stats{display:flex;justify-content:space-around;text-align:center;margin:10px 0}

.wr{padding:8px 0;border-top:1px solid var(--bd);font-size:.95rem}
.row{display:flex;gap:10px}.row>*{flex:1}
select{font:inherit;padding:8px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
.rv details{background:var(--card);border:1px solid var(--bd);border-radius:12px;margin:8px 0;padding:0 14px}.rv summary{cursor:pointer;padding:11px 0;font-weight:600}.rv summary span{color:var(--sub);font-weight:400;font-size:.85rem}.rw{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--bd);font-size:.95rem}.rw b{flex:0 0 46%}.rw i{font-style:normal;color:var(--sub);text-align:right}#srch{width:100%;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);margin-bottom:6px}

const SR=`因果|___ it rained heavily, the game was cancelled.|Because|Although|Unless|Until

const D=RAW.trim().split("\n").map(l=>{const[c,e,z]=l.split("|");return{c,e,z}});
const S=SR.trim().split("\n").map(l=>{const[c,s,a,...d]=l.split("|");return{c,s,a,d}});
const CATS=[...new Set(D.map(x=>x.c))];
const MODES={mix:["綜合測驗","三種題型隨機出"],mc:["中英選擇","看英文選中文、看中文選英文"],fill:["句子填空","選出最適合的連接詞"],match:["配對題","把英文和中文配成對"]};
const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const $=s=>document.querySelector(s);
let mode="mix",cats=new Set(CATS),N=10,G=null;
let best={};try{best=JSON.parse(localStorage.getItem("tw_best")||"{}")}catch(e){}
const saveBest=()=>{try{localStorage.setItem("tw_best",JSON.stringify(best))}catch(e){}};

function home(){
 $("#app").innerHTML=`<h1>✏️ 學測連接詞・轉折語練習</h1><div class="sub">共 ${D.length} 組單字片語、${S.length} 題填空，每天練幾分鐘就有感。</div>
 <h2>1. 選擇題型</h2><div class="modes">${Object.entries(MODES).map(([k,v])=>`<button class="mode ${k===mode?"on":""}" data-m="${k}"><b>${v[0]}</b><span>${v[1]}</span>${best[k]!=null?`<span><br>最佳：${best[k]} 分</span>`:""}</button>`).join("")}</div>
 <h2>2. 選擇範圍</h2><div class="chips"><button class="chip ${cats.size===CATS.length?"on":""}" data-c="all">全部</button>${CATS.map(c=>`<button class="chip ${cats.has(c)&&cats.size<CATS.length?"on":""}" data-c="${c}">${c}</button>`).join("")}</div>
 <h2>3. 題數</h2><select id="n">${[5,10,20,30].map(n=>`<option ${n===N?"selected":""}>${n}</option>`).join("")}</select> <span class="sub">題（配對題 5 組為一回合）</span>
 <button class="go" id="start">開始練習</button>
 <div class="card sub" style="margin-top:22px">計分：答對 +10 分；連續答對 3 題起每題加分（最高 +4）。配對題一次就配對成功才得分。</div>
 <h2>📖 考前複習：單字片語總表（${D.length} 組）</h2><input id="srch" placeholder="搜尋英文或中文…"><div class="rv" id="rv">${CATS.map(c=>{const a=D.filter(x=>x.c===c);return`<details><summary>${c} <span>${a.length} 組</span></summary>${a.map(x=>`<div class="rw"><b>${x.e}</b><i>${x.z}</i></div>`).join("")}</details>`}).join("")}</div>`;
 document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{mode=b.dataset.m;home()});
 document.querySelectorAll(".chip").forEach(b=>b.onclick=()=>{const c=b.dataset.c;if(c==="all")cats=new Set(CATS);else{if(cats.size===CATS.length)cats=new Set([c]);else cats.has(c)?cats.delete(c):cats.add(c);if(!cats.size)cats=new Set(CATS)}home()});
 $("#n").onchange=e=>N=+e.target.value;
 $("#start").onclick=start;
 $("#srch").oninput=e=>{const v=e.target.value.trim().toLowerCase();document.querySelectorAll("#rv details").forEach(d=>{let n=0;d.querySelectorAll(".rw").forEach(r=>{const m=!v||r.textContent.toLowerCase().includes(v);r.style.display=m?"":"none";if(m)n++});d.style.display=n?"":"none";d.open=!!v&&n>0})};
}
const pool=()=>D.filter(x=>cats.has(x.c));
function cyc(a,n){let r=[];while(r.length<n)r=r.concat(sh(a));return r.slice(0,n)}
function genMC(it){const dir=Math.random()<.5;const ds=sh(D.filter(x=>x.c!==it.c&&x.z!==it.z)).slice(0,3);return{t:"mc",dir,it,opts:sh([it,...ds])}}
function genFill(s){return{t:"fill",s,opts:sh([s.a,...s.d])}}
function genMatch(){const p=sh(pool());const seen=new Set(),pick=[];for(const x of p){if(!seen.has(x.c)&&!pick.some(y=>y.z===x.z)){seen.add(x.c);pick.push(x)}if(pick.length===5)break}
 for(const x of p){if(pick.length>=5)break;if(!pick.includes(x)&&!pick.some(y=>y.z===x.z))pick.push(x)}
 return{t:"match",pairs:pick,right:sh(pick.map((_,i)=>i)),sel:null,done:new Set(),first:new Set(pick.map((_,i)=>i)),flash:null}}
function start(){
 const P=pool(),SS=S.filter(x=>cats.has(x.c));const fp=SS.length?SS:S;
 let qs=[];
 if(mode==="mc")qs=cyc(P,N).map(genMC);
 else if(mode==="fill")qs=cyc(fp,N).map(genFill);
 else if(mode==="match")qs=Array.from({length:Math.max(1,Math.round(N/5))},genMatch);
 else{const a=cyc(P,N),b=cyc(fp,N);qs=a.map((x,i)=>{const r=Math.random();return r<.4?genMC(x):r<.8?genFill(b[i]):genMatch()});const m=qs.filter(q=>q.t==="match");if(m.length>2){let k=0;qs=qs.filter(q=>q.t!=="match"||++k<=2)}}
 G={qs,i:0,score:0,streak:0,ok:0,tot:0,wrong:[]};show();
}
function hdr(){const pct=G.i/G.qs.length*100;return`<div class="hd"><span>第 ${G.i+1} / ${G.qs.length} 題</span><span>🔥 連對 ${G.streak}</span><b>分數 ${G.score}</b></div><div class="bar"><i style="width:${pct}%"></i></div>`}
function award(ok){if(ok){G.streak++;G.ok++;G.tot++;const p=10+(G.streak>=3?Math.min(G.streak-2,4):0);G.score+=p;return p}G.streak=0;G.tot++;return 0}
function show(){
 if(G.i>=G.qs.length)return result();
 const q=G.qs[G.i];
 if(q.t==="match")return renderMatch();
 let body;
 if(q.t==="mc"){const L=q.dir;body=`<div class="sub">${L?"選出正確的中文意思":"選出正確的英文"}</div><div class="q">${L?q.it.e:q.it.z}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${L?o.z:o.e}</button>`).join("")}</div>`}
 else body=`<div class="sub">選出最適合填入空格的字詞</div><div class="q" style="font-size:1.25rem">${q.s.s.replace("___","<u>　　　　</u>")}</div><div class="opts">${q.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join("")}</div>`;
 $("#app").innerHTML=hdr()+`<div class="card">${body}<div id="fb"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(q,+b.dataset.k));
}
function pick(q,k){
 if(q.done)return;q.done=1;
 const isOk=q.t==="mc"?q.opts[k]===q.it:q.opts[k]===q.s.a;
 const p=award(isOk);
 const btns=document.querySelectorAll(".opt");btns.forEach((b,j)=>{b.disabled=true;const right=q.t==="mc"?q.opts[j]===q.it:q.opts[j]===q.s.a;if(right)b.classList.add("ok");else if(j===k)b.classList.add("no")});
 let info;
 if(q.t==="mc")info=`<b>${q.it.e}</b>：${q.it.z}`;
 else{const m=D.find(x=>x.e.toLowerCase()===q.s.a.toLowerCase());info=`${q.s.s.replace("___","<b>"+q.s.a+"</b>")}${m?`<br>${m.e}：${m.z}`:""}`}
 if(!isOk)G.wrong.push(q.t==="mc"?`${q.it.e}：${q.it.z}`:q.s.s.replace("___","<b>"+q.s.a+"</b>"));
 $("#fb").innerHTML=`<div class="fb ${isOk?"ok":"no"}">${isOk?`✅ 答對了！+${p} 分`:"❌ 再接再厲"}<br>${info}</div><button class="go" id="nx">${G.i+1>=G.qs.length?"看成績":"下一題"}</button>`;
 $("#nx").onclick=()=>{G.i++;show()};
 const sc=document.querySelector(".hd b");if(sc)sc.textContent="分數 "+G.score;
}
function renderMatch(){
 const q=G.qs[G.i],all=q.done&&q.done===5;
 const fl=q.flash;
 $("#app").innerHTML=hdr()+`<div class="card"><div class="sub">點一個英文，再點對應的中文（共 5 組）</div><div class="mt"><div class="opts" style="margin:0">${q.pairs.map((p,i)=>`<button class="opt ${q.done instanceof Set?"":""}${q.dn&&q.dn.has(i)?"done":""} ${q.sel===i?"sel":""} ${fl&&fl[0]===i?"bad":""}" data-l="${i}">${p.e}</button>`).join("")}</div><div class="opts" style="margin:0">${q.right.map(i=>`<button class="opt ${q.dn&&q.dn.has(i)?"done":""} ${fl&&fl[1]===i?"bad":""}" data-r="${i}">${q.pairs[i].z}</button>`).join("")}</div></div><div id="fb"></div></div>`;
 if(q.dn&&q.dn.size===5){$("#fb").innerHTML=`<div class="fb ok">🎉 本回合完成！</div><button class="go" id="nx">${G.i+1>=G.qs.length?"看成績":"下一回合"}</button>`;$("#nx").onclick=()=>{G.i++;show()};return}
 document.querySelectorAll("[data-l]").forEach(b=>b.onclick=()=>{const i=+b.dataset.l;if(q.dn&&q.dn.has(i))return;q.sel=i;renderMatch()});
 document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{
  const r=+b.dataset.r;if(q.sel==null||(q.dn&&q.dn.has(r)))return;
  q.dn=q.dn||new Set();const l=q.sel;
  if(l===r){const first=q.first.has(l);q.dn.add(l);q.sel=null;if(first){G.ok++;G.tot++;G.score+=10;G.streak++}else{G.tot++}
   const sc=document.querySelector(".hd b");renderMatch()}
  else{if(q.first.has(l)){q.first.delete(l);G.wrong.push(`${q.pairs[l].e}：${q.pairs[l].z}`);G.streak=0}q.flash=[l,r];q.sel=null;renderMatch();setTimeout(()=>{q.flash=null;if(G.qs[G.i]===q)renderMatch()},500)}
 });
}
function result(){
 const acc=G.tot?Math.round(G.ok/G.tot*100):0;
 const g=acc>=90?["S","太強了！"]:acc>=75?["A","很穩！"]:acc>=60?["B","再加強一點"]:["C","多練幾次一定會進步"];
 const nb=best[mode]==null||G.score>best[mode];if(nb){best[mode]=G.score;saveBest()}
 const uw=[...new Set(G.wrong)];
 $("#app").innerHTML=`<h1>練習完成</h1><div class="card"><p class="big">${g[0]}</p><p style="text-align:center;margin:0">${g[1]}${nb?" 🏆 新紀錄！":""}</p>
 <div class="stats"><div><b>${G.score}</b><span class="sub">總分</span></div><div><b>${acc}%</b><span class="sub">正確率</span></div><div><b>${G.ok}/${G.tot}</b><span class="sub">答對</span></div></div></div>
 ${uw.length?`<h2>錯題複習（${uw.length}）</h2><div class="card">${uw.map(w=>`<div class="wr">${w}</div>`).join("")}</div>`:`<div class="card">全部答對，沒有錯題 🎉</div>`}
 <div class="row" style="margin-top:14px"><button class="go" id="again" style="margin:0">再練一次</button><button class="sec" id="hm">回首頁</button></div>`;
 $("#again").onclick=start;$("#hm").onclick=home;
}
home();
</script>
</body>
</html>
